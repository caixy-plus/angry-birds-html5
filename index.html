<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>愤怒的小鸟 - Angry Birds HTML5</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game-container" aria-label="愤怒的小鸟游戏画布容器">
    <!-- Top HUD -->
    <header class="hud-bar">
      <div class="hud-group" role="group" aria-label="关卡选择">
        <span class="hud-stat"><span class="label">关卡</span></span>
        <button type="button" class="btn level-btn active" data-level="0">1</button>
        <button type="button" class="btn level-btn" data-level="1">2</button>
        <button type="button" class="btn level-btn" data-level="2">3</button>
      </div>

      <div class="hud-group" role="group" aria-label="游戏状态">
        <div class="hud-stat">
          <span class="label">得分</span>
          <span class="value" id="score-val">0</span>
        </div>
        <div class="hud-stat">
          <span class="label">最高分</span>
          <span class="value" id="best-val">0</span>
        </div>
        <div class="hud-stat">
          <span class="label">剩余小鸟</span>
          <span class="value" id="birds-val">4</span>
        </div>
        <div class="hud-stat">
          <span class="label">剩余绿猪</span>
          <span class="value" id="pigs-val">3</span>
        </div>
      </div>

      <div class="hud-group" role="group" aria-label="游戏操作">
        <button type="button" class="btn btn-primary" id="demo-btn" title="AI自动演示第一关一鸟三星通关">🤖 演示一鸟通关</button>
        <button type="button" class="btn" id="skill-btn" title="飞行中触发小鸟特技 (空格键)">⚡ 特技 (Space)</button>
        <button type="button" class="btn" id="sound-btn" aria-pressed="true">🔊 音效: 开</button>
        <button type="button" class="btn" id="restart-btn">🔄 重玩本关</button>
      </div>
    </header>

    <canvas id="game-canvas" width="1280" height="720"></canvas>

    <div class="controls-hint">
      🎯 拖拽弹弓发射小鸟 ｜ 飞行中按 <strong>空格键 / 点击画布</strong> 触发特技（红鸟怒吼冲击、黄鸟加速冲刺、蓝鸟分身三连、黑鸟爆炸）｜ 按 <strong>R</strong> 重置
    </div>

    <dialog id="result-dialog" closedby="any" aria-labelledby="dialog-title">
      <h2 class="dialog-title" id="dialog-title">🎉 关卡胜利！</h2>
      <div class="dialog-stars" id="dialog-stars" aria-label="星级评价">⭐⭐⭐</div>
      <p class="dialog-score" id="dialog-score">本局得分：12500</p>
      <div class="dialog-actions">
        <button type="button" class="btn" id="dialog-retry-btn">🔄 再玩一次</button>
        <button type="button" class="btn btn-primary" id="dialog-next-btn" autofocus>▶️ 下一关</button>
      </div>
    </dialog>
  </main>

  <script src="game.js"></script>
</body>
</html>
